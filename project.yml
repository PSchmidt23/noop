name: Strand
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Base/development language. The in-source UI strings are authored in English (US);
  # the String Catalog (Strand/Resources/Localizable.xcstrings) carries this as the
  # source language and is where additional languages are added.
  developmentLanguage: en
# Project-level xcconfig: Xcode layers this beneath every target's OWN configFiles (a target-level
# xcconfig only shadows keys it redefines itself), so this is the one place BUNDLE_ID_PREFIX is
# defined — every target picks it up automatically, including Strand/StrandTests/NOOPiOS, which also
# carry Strand/Oura/OuraConfig.xcconfig for their unrelated Oura credentials. See Config/BundleId.xcconfig.
configFiles:
  Debug: Config/BundleId.xcconfig
  Release: Config/BundleId.xcconfig
settings:
  base:
    MARKETING_VERSION: "11.8.0"
    # iOS build number (CFBundleVersion). GLOBAL so the iOS app AND its widget extension inherit the
    # SAME value — they must match or iOS warns "extension version must match parent app" (#416).
    # macOS sets its own CFBundleVersion on the Strand target and is unaffected by this.
    CURRENT_PROJECT_VERSION: "429"
    SWIFT_VERSION: "5.0"
    # Emit localizable strings so Xcode auto-extracts every LocalizedStringKey into the
    # String Catalog on build (the English (US) base entries).
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Single source of truth for the App Group id shared by the iOS app + its widget / Live Activity
    # extension. Referenced as $(APP_GROUP_ID) by both targets' entitlements and Info.plist, and read
    # at runtime via the AppGroupIdentifier Info.plist key (WidgetSnapshot.suiteName) so the value is
    # never hard-coded in Swift. Built from $(BUNDLE_ID_PREFIX) (see Config/BundleId.xcconfig) — set
    # BUNDLE_ID_PREFIX in a gitignored Config/BundleIdSecrets.xcconfig to build under your own Apple ID.
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).noop.staging
    # Build for both Apple Silicon and Intel so the release runs on every Mac.
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Release:
      # Distribution builds must produce a universal binary, not just the host arch.
      ONLY_ACTIVE_ARCH: NO
packages:
  # Renders the Coach's LLM replies (GitHub-flavored Markdown — bold, lists,
  # headings, tables). Pinned exactly for reproducible community builds.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  WhoopProtocol:
    path: Packages/WhoopProtocol
  WhoopStore:
    path: Packages/WhoopStore
  StrandAnalytics:
    path: Packages/StrandAnalytics
  StrandImport:
    path: Packages/StrandImport
  StrandDesign:
    path: Packages/StrandDesign
  # Clean-room local Oura ring BLE protocol (framing, auth, decoders, driver). Pure value types,
  # zero CoreBluetooth, so it stays headless/JVM-testable; the app target imports it for OuraLiveSource.
  OuraProtocol:
    path: Packages/OuraProtocol
  # Clean-room local Polar sensor facts: model identification + PMD stream capability catalog (pure value
  # types, zero CoreBluetooth, headless/JVM-testable). The app target imports it so StandardHRSource can
  # log which Polar model a connecting strap is, and the Test Centre can auto-detect it from the paired
  # record. The live PMD data path is not wired yet — this is identification/diagnostics only.
  PolarProtocol:
    path: Packages/PolarProtocol
  # Compresses the full-database `.noopbak` backup (single-entry deflate ZIP) in DataBackup.swift.
  # Already resolved transitively via StrandImport; linked directly so the app target can
  # `import ZIPFoundation`. Same exact version as StrandImport's, so SPM resolves one copy.
  # Supply-chain: pinned EXACT (not `from:`) so a clean resolve can't auto-pull a newer —
  # potentially compromised — upstream release. Bump deliberately, in lockstep with the
  # Packages/*/Package.swift exact constraints and the committed Package.resolved.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  Strand:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
          # The liquid Today is now cross-platform: its iOS-only chrome (topBarTrailing / navigationBarTitleDisplayMode
          # / presentationCompactAdaptation / two-param onChange / sensoryFeedback) is guarded, so the mac split-view
          # shell hosts LiquidTodayView too. All Liquid/* now compile into the mac target.
      # The stress screen is shared with iOS and prints levels through the widget's parity formatter,
      # so its Foundation-only trace model belongs to the macOS app module as well.
      - StrandiOSShared/StressTrace.swift
    # Oura BYO-app OAuth credentials. OuraConfig.xcconfig is a tracked wrapper that optionally
    # includes the untracked, gitignored Strand/Oura/OuraSecrets.xcconfig (template at
    # OuraSecrets.example.xcconfig) — absent secrets leave the $(OURA_*) references in the
    # info.properties below empty, which disables the Oura Cloud lane at runtime.
    configFiles:
      Debug: Strand/Oura/OuraConfig.xcconfig
      Release: Strand/Oura/OuraConfig.xcconfig
    info:
      path: Strand/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "198"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your Mac. Nothing leaves your device."
        NSLocationWhenInUseUsageDescription: "NOOP records your route during an outdoor workout to show distance, pace, and a map. The route stays on your device. Nothing leaves it."
        # The AI Coach's "Custom (OpenAI-compatible)" provider talks to a LOCAL LLM server over plain
        # HTTP on loopback (Ollama / LM Studio / llama.cpp at http://localhost:…). ATS blocks cleartext
        # by default; NSAllowsLocalNetworking exempts loopback/.local/unqualified hosts ONLY — public
        # HTTPS endpoints are unaffected. No arbitrary-loads blanket exemption.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Oura BYO-app OAuth credentials (values come from configFiles above); read at runtime via
        # OuraCredentials.fromBundle. Absent/blank values cleanly disable the Connect-Oura lane.
        OURA_CLIENT_ID: $(OURA_CLIENT_ID)
        OURA_CLIENT_SECRET: $(OURA_CLIENT_SECRET)
        OURA_REDIRECT_URI: $(OURA_REDIRECT_URI)
        # Registers the noop:// URL scheme so ASWebAuthenticationSession's OAuth redirect
        # (noop://oura/callback) reaches OuraOAuthProvider instead of bouncing off the OS.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [noop]
    entitlements:
      path: Strand/Resources/Strand.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        # Outbound client access — used ONLY by the opt-in, consent-gated, BYOK AI Coach.
        # The ad-hoc distributed build applies NO entitlements (unsigned build + ad-hoc
        # re-sign), so this matters only for a SIGNED/sandboxed build (where the sandbox
        # otherwise blocks the Coach's request — #128). Data path stays network-free.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.staging
        PRODUCT_NAME: "NOOP Staging"
        # Pin the Swift module name so `@testable import Strand` resolves even though PRODUCT_NAME is
        # NOOP — the test target and shared sources refer to the app module as `Strand`.
        PRODUCT_MODULE_NAME: Strand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Hardened Runtime closes the DYLD_INSERT_LIBRARIES injection vector for the
        # distributed (ad-hoc) build. The app uses no JIT / unsigned-exec memory, so it's safe.
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: MarkdownUI
      - package: ZIPFoundation
      - package: OuraProtocol
      - package: PolarProtocol
  StrandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - StrandTests
      # Compile the exact cross-target snapshot source into the test bundle so the AltStore App Group
      # resolver is covered without adding this iOS/widget-only type to the macOS application module.
      - StrandiOSShared/WidgetSnapshot.swift
      # Same reasoning for the heart-rate trace: the pure half of the widget is where every decision
      # worth testing lives, and it is iOS/widget-only, so it is compiled into the test bundle rather
      # than added to the macOS app.
      - StrandiOSShared/HrTrace.swift
      # And the stress curve's pure half (#2040), compiled directly into the test bundle so its
      # geometry stays isolated from app state. This is also the only place that can compare the
      # extension-safe `StressTrace.highBandFloor` copy with the analytics package constant.
      - StrandiOSShared/StressTrace.swift
      # And the widget cost counters, for the same reason again: pure, iOS-only, and the arithmetic is
      # exactly the part that has been wrong twice on the Android side.
      - StrandiOSShared/WidgetTelemetry.swift
    # Same wrapper as the app target, so the OURA_CLOUD_IMPORT-gated Oura tests compile exactly
    # when the app's Oura lane does (flag + creds both come from the untracked OuraSecrets.xcconfig).
    configFiles:
      Debug: Strand/Oura/OuraConfig.xcconfig
      Release: Strand/Oura/OuraConfig.xcconfig
    dependencies:
      - target: Strand
      - package: WhoopProtocol
      - package: WhoopStore
      - package: OuraProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).strandtests
        # Host the unit tests in the app so `@testable import Strand` links against the real app module.
        # NOTE: must track the app target's PRODUCT_NAME ("NOOP Staging" since the staging rename).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NOOP Staging.app/Contents/MacOS/NOOP Staging"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # ---------------------------------------------------------------------------
  # iOS app target (community build-from-source; never distributed via the App
  # Store — NOOP stays anonymous). Reuses the five shared packages + most of the
  # macOS app's Strand/ sources; the macOS-only scene/menu-bar/notification files
  # are excluded, and the iOS app shell + HealthKit + widgets/intents live under
  # StrandiOS/. See docs/IOS.md.
  NOOPiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
          - "Resources/Assets.xcassets"
          - "App/StrandApp.swift"
          - "App/RootView.swift"
          # ContentView embeds RootView() (the macOS NavigationSplitView sidebar shell), which is
          # excluded above — so ContentView cannot compile on iOS. The iOS shell is RootTabView,
          # wired in StrandiOS/App/StrandiOSApp.swift (which reproduces ContentView's onboarding/
          # Terms/What's-New gates around the TabView). Without this exclude the iOS target fails to
          # resolve RootView().
          - "App/ContentView.swift"
          - "MenuBar"
          - "Data/NotificationSettingsStore.swift"
          - "Screens/NotificationSettingsView.swift"
          # macOS-only AppIntents (BuzzStrap/MarkMoment) — iOS uses StrandiOS/System/NOOPAppIntents.swift.
          # Without this exclude both compile into the iOS target and collide on NOOPAppIntents.stringsdata.
          - "System/NOOPAppIntents.swift"
      - path: StrandiOS
        excludes:
          - "Resources/Info.plist"
          - "Resources/NOOP.entitlements"
      - path: StrandiOSShared
    # Same tracked wrapper as the macOS target (Strand/Oura/ is shared, not per-platform).
    configFiles:
      Debug: Strand/Oura/OuraConfig.xcconfig
      Release: Strand/Oura/OuraConfig.xcconfig
    info:
      path: StrandiOS/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Surfaces APP_GROUP_ID to runtime (WidgetSnapshot.suiteName) so the App Group id isn't
        # hard-coded in Swift; stays in sync with the application-groups entitlement (both $(APP_GROUP_ID)).
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        # Alternate app icons (v3 "Titanium & Gold"). The primary icon stays the asset-catalog
        # AppIcon (machined titanium); the alternate "AppIcon-Navy" (blued titanium) is declared
        # here so UIApplication.setAlternateIconName("AppIcon-Navy") can switch to it at runtime.
        # CFBundleIconFiles is intentionally empty — the artwork lives in the asset catalog, shipped
        # via ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS, so no loose PNGs are listed here.
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIcon-Navy:
              CFBundleIconFiles: []
              UIPrerenderedIcon: false
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          # #524: keep recording an outdoor workout's GPS route while the app is backgrounded (screen off),
          # matching Android's foreground-service capture. Required by GpsWorkoutRecorder's
          # allowsBackgroundLocationUpdates; without this mode iOS crashes when background updates start.
          - location
          # #510: the scheduled debug auto-export submits a BGAppRefreshTaskRequest so iOS can wake the
          # backgrounded app near the user's chosen time to write the overnight strap-log drop. BGAppRefresh
          # needs the "fetch" background mode; the task id below must also be permitted (and registered at
          # launch in StrandiOSApp.init) or the submit fails gracefully and only the foreground/"Run now"
          # paths run.
          - fetch
          # #1538: the re-score continuation submits a BGProcessingTaskRequest, which needs the
          # "processing" mode — "fetch" only covers the metered BGAppRefresh kind. A strap offload
          # completes while backgrounded and the pass it triggers ran to nearly eight minutes on the
          # reporter's install, which no bluetooth-central wake survives; a processing task is the long,
          # deferrable kind that can finish it.
          - processing
        # Permit every background-task identifier. Each derives from Bundle.main at runtime so it
        # tracks BUNDLE_ID_PREFIX, and each is registered from StrandiOSApp.init before launch finishes.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).debugexport
          - $(PRODUCT_BUNDLE_IDENTIFIER).coachbrief
          # Best-effort fallback that writes already-banked WHOOP data to HealthKit when iOS grants
          # background time. Fresh offloads also write immediately from their completion hook.
          - $(PRODUCT_BUNDLE_IDENTIFIER).healthwriteback
          # #1538: finishes a re-score that a backgrounded offload started and could not complete. The
          # only BGProcessingTask of the three; the other two are refresh tasks.
          - $(PRODUCT_BUNDLE_IDENTIFIER).rescore
          # #2556: the stale-battery warning needs a wake that does NOT depend on the strap. It cannot ride
          # the re-score task, which is submitted only when a re-score is OWED, and a missing strap owes
          # none, so that task would never run in the one case the warning exists for.
          - $(PRODUCT_BUNDLE_IDENTIFIER).stalebattery
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your iPhone. Nothing leaves your device."
        NSLocationWhenInUseUsageDescription: "NOOP records your route during an outdoor workout to show distance, pace, and a map, and keeps recording while the screen is off. The route stays on your device. Nothing leaves it."
        NSHealthShareUsageDescription: "NOOP reads your own Apple Health data on-device to compute recovery, strain, and sleep. Nothing leaves your device."
        NSHealthUpdateUsageDescription: "NOOP writes the metrics it computes from your strap back into Apple Health, on-device and only when you allow it."
        NSMotionUsageDescription: "NOOP reads your iPhone's step count for a walking or running workout to show steps in the activity summary. It stays on your device. Nothing leaves it."
        # K4: Coach voice input. Speech is transcribed ON-DEVICE ONLY (requiresOnDeviceRecognition);
        # the mic button is disabled where the locale doesn't support that, never falls back to
        # server transcription. Only the resulting TEXT reaches the provider, via the same channel
        # a typed question already uses.
        NSSpeechRecognitionUsageDescription: "NOOP transcribes your question on-device so you can ask the coach out loud instead of typing. Audio never leaves your iPhone."
        NSMicrophoneUsageDescription: "NOOP uses the microphone to let you ask the coach a question by voice. The audio is transcribed on-device and never leaves your iPhone."
        # #187: the opt-in AI Coach's "Custom (OpenAI-compatible)" provider can point at a LOCAL LLM on
        # the LAN (Ollama / LM Studio at http://192.168.x.x:11434). ATS blocks cleartext by default;
        # NSAllowsLocalNetworking exempts loopback/.local/private-LAN hosts ONLY — public HTTPS endpoints
        # are unaffected, so cloud providers stay TLS. Mirrors the macOS target.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # #155: expose the app's Documents folder to Files/Shortcuts so the user's Siri Shortcut can
        # read the opt-in noop_sync.txt drop file (Apple-Health-free export for sideloaded installs).
        # Both keys are required for the folder to actually appear in Files.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Oura BYO-app OAuth credentials (values come from configFiles above); read at runtime via
        # OuraCredentials.fromBundle. Absent/blank values cleanly disable the Connect-Oura lane.
        OURA_CLIENT_ID: $(OURA_CLIENT_ID)
        OURA_CLIENT_SECRET: $(OURA_CLIENT_SECRET)
        OURA_REDIRECT_URI: $(OURA_REDIRECT_URI)
        # Registers the noop:// URL scheme so ASWebAuthenticationSession's OAuth redirect
        # (noop://oura/callback) reaches OuraOAuthProvider instead of bouncing off the OS.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [noop]
    entitlements:
      path: StrandiOS/Resources/NOOP.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Required by HealthKit on iOS 15+ for the observer queries registered by HealthKitBridge.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop
        PRODUCT_NAME: "NOOP Staging"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ship every *.appiconset (not just the primary AppIcon) so the alternate "AppIcon-Navy"
        # set is compiled into the bundle and is available to UIApplication.setAlternateIconName.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: MarkdownUI
      - package: ZIPFoundation
      - package: PolarProtocol
      - target: NOOPiOSWidgets
      # Embed the watchOS app so the iPhone app carries it (NOOP.app/Watch/NOOPWatch.app). A watch app
      # installs by riding inside its iOS companion; without this it would never reach a paired watch.
      # Build-from-source delivers it for certain; sideload install of the embedded watch app under a free
      # Apple ID is unproven (an Apple limitation), so the docs steer watch users to a source build for now.
      - target: NOOPWatch

  # Baseline — Patrick's HRV/RHR-trends app on NOOP's engine. Compiles the same sources as NOOPiOS
  # (minus NOOP's @main) plus Baseline/. Keep upstream-untouched: add files, don't edit NOOP's.
  Baseline:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
          - "Resources/Assets.xcassets"
          - "App/StrandApp.swift"
          - "App/RootView.swift"
          # ContentView embeds RootView() (the macOS NavigationSplitView sidebar shell), which is
          # excluded above — so ContentView cannot compile on iOS. The iOS shell is RootTabView,
          # wired in StrandiOS/App/StrandiOSApp.swift (which reproduces ContentView's onboarding/
          # Terms/What's-New gates around the TabView). Without this exclude the iOS target fails to
          # resolve RootView().
          - "App/ContentView.swift"
          - "MenuBar"
          - "Data/NotificationSettingsStore.swift"
          - "Screens/NotificationSettingsView.swift"
          # macOS-only AppIntents (BuzzStrap/MarkMoment) — iOS uses StrandiOS/System/NOOPAppIntents.swift.
          # Without this exclude both compile into the iOS target and collide on NOOPAppIntents.stringsdata.
          - "System/NOOPAppIntents.swift"
      - path: StrandiOS
        excludes:
          - "Resources/Info.plist"
          - "Resources/NOOP.entitlements"
          # NOOP's @main — Baseline ships its own entry point in Baseline/App/BaselineApp.swift.
          - "App/StrandiOSApp.swift"
          # NOOP's catalog (AppIcon, AppIcon-Navy, scene1…10, sleepNightHero) and the loose alternate
          # icon PNGs. No screen Baseline hosts reads them: `scene*` is loaded only by StrandDesign's
          # SceneHeroBackground, which no compiled-in NOOP screen references; `sleepNightHero` is read only
          # by SleepView's private SleepPerformanceNightScene (Baseline's Sleep tab calls SleepView's static
          # night-grouping helpers, never the view); AppIcon-Navy is switched only from NOOP's SettingsView.
          # Baseline/Resources/Assets.xcassets (BaselineIcon, LaunchBackground) is the only catalog compiled.
          - "Resources/Assets.xcassets"
          - "Resources/AltIcons"
      - path: StrandiOSShared
      # Everything under Baseline/ is swept: Swift into Sources, the rest (Assets.xcassets, the privacy
      # manifest Resources/PrivacyInfo.xcprivacy) into Copy Bundle Resources, which is where XcodeGen
      # puts an extension it does not special-case. Repo documents and the build script are excluded
      # so they do not ship inside the app bundle.
      - path: Baseline
        excludes:
          - "ENGINE_MAP.md"
          - "PRIVACY.md"
          - "scripts"
          # App Store copy, review notes and the submission checklist: repo documents, never bundled.
          - "Store"
          # Upstream patch proposals (git format-patch files + their READMEs) and the design-system
          # notes: repo documents too. Without these excludes XcodeGen copies them into Baseline.app
          # (caught by Baseline/scripts/release-check.sh).
          - "Upstream"
          - "Components/DESIGN.md"
          # Research notes (engine capabilities, the metric-accuracy literature review): repo documents
          # that quote NOOP's identifiers and name WHOOP throughout. Never bundled; release-check.sh fails
          # on any Markdown at the bundle root other than ATTRIBUTION.md.
          - "Research"
      # Legal texts for Settings → About. PolyForm Noncommercial requires passing the terms along;
      # the MIT/BSD notices in NOTICE and the credits in ATTRIBUTION.md must accompany the binary too.
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: ATTRIBUTION.md
        buildPhase: resources
    # No configFiles: NOOP's Strand/Oura/OuraConfig.xcconfig exists only to pull in the untracked
    # OuraSecrets.xcconfig (OURA_* OAuth keys + the OURA_CLOUD_IMPORT compilation condition). Every
    # reader of those keys sits under #if OURA_CLOUD_IMPORT, and `OuraCredentials.fromBundle` returns
    # nil on absent keys, so without the wrapper the Oura cloud lane is simply never compiled in.
    info:
      path: Baseline/Resources/Info.plist
      properties:
        CFBundleName: Baseline
        CFBundleDisplayName: Baseline
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Surfaces APP_GROUP_ID to runtime (WidgetSnapshot.suiteName) so the App Group id isn't
        # hard-coded in Swift; stays in sync with the application-groups entitlement (both $(APP_GROUP_ID)).
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        # Launch screen: a flat fill in BaselineTheme.background (the LaunchBackground colorset in
        # Baseline/Resources/Assets.xcassets), so the first frame matches the navy every screen fades
        # in over instead of flashing white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Export compliance, answered once here so App Store Connect never parks a build on "Missing
        # Compliance". Baseline ships no non-exempt encryption: the only cipher in the binary is the
        # AES-128 challenge/response in Packages/OuraProtocol/Auth.swift, which goes through Apple's
        # CommonCrypto and serves device authentication only (an exempt use), and any HTTPS is the
        # OS's own TLS via URLSession. Re-check this answer if a cipher is ever added for data at rest
        # or in transit.
        ITSAppUsesNonExemptEncryption: false
        # Not carried over from NOOP's block: CFBundleIcons (the alternate "AppIcon-Navy" set is switched
        # only from NOOP's Settings screen, which Baseline does not host, and its catalog is excluded
        # above), NSSupportsLiveActivities (deferred; LiveActivityController gates on
        # areActivitiesEnabled, false without the key), NSAppTransportSecurity's local-networking
        # exemption (the AI coach is deferred and Baseline makes no network connections),
        # UIFileSharingEnabled / LSSupportsOpeningDocumentsInPlace (the Siri Shortcut drop file and
        # folder backups are deferred, so Documents stays private), the OURA_* OAuth keys and the `noop`
        # URL scheme (every Oura reader is under #if OURA_CLOUD_IMPORT, which no tracked build sets, and
        # OuraCredentials.fromBundle returns nil on absent keys; the `noop://import-health` Shortcut
        # import is wired by `.onOpenURL` in StrandiOSApp.swift, which Baseline excludes, so
        # ShortcutHealthImport is never reached). Every NS*UsageDescription for a framework the binary
        # links stays: a missing one is a hard crash the moment that NOOP code path runs.
        # Baseline's OWN scheme, added back for the widgets: every BaselineWidgets tap opens
        # `baseline://home` (BaselineDeepLink.home), which BaselineRoot consumes with `.onOpenURL`. Not
        # `noop`, so a NOOP install on the same phone never claims a Baseline widget's tap.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [baseline]
        # Baseline is an iPhone app (TARGETED_DEVICE_FAMILY 1 below): portrait only, and no
        # ~ipad orientation list, because it runs on iPad in iPhone-compatibility mode.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          # `location` stays although no Baseline screen records a GPS route: NOOP's GpsWorkoutRecorder
          # (#524) sets allowsBackgroundLocationUpdates = true in its init, and AppModel constructs it at
          # launch, so without the mode CoreLocation throws NSInternalInconsistencyException on every start
          # (seen when the mode was dropped; the unit-test host crashed before the first test). Removing it
          # needs an upstream change that defers that assignment to the moment a route is actually recorded.
          - location
          # BGAppRefresh tasks (healthwriteback, stalebattery) need the "fetch" background mode.
          - fetch
          # #1538: the re-score continuation submits a BGProcessingTaskRequest, which needs the
          # "processing" mode — "fetch" only covers the metered BGAppRefresh kind. A strap offload
          # completes while backgrounded and the pass it triggers ran to nearly eight minutes on the
          # reporter's install, which no bluetooth-central wake survives; a processing task is the long,
          # deferrable kind that can finish it.
          - processing
        # The background-task identifiers BaselineApp.init registers (each derives from Bundle.main at
        # runtime). NOOP's debugexport and coachbrief tasks are not registered by Baseline's entry point,
        # so they are not permitted here; a submit for an unpermitted id throws and is caught.
        BGTaskSchedulerPermittedIdentifiers:
          # Best-effort fallback that writes already-banked WHOOP data to HealthKit when iOS grants
          # background time. Fresh offloads also write immediately from their completion hook.
          - $(PRODUCT_BUNDLE_IDENTIFIER).healthwriteback
          # #1538: finishes a re-score that a backgrounded offload started and could not complete. The
          # only BGProcessingTask of the three; the other two are refresh tasks.
          - $(PRODUCT_BUNDLE_IDENTIFIER).rescore
          # #2556: the stale-battery warning needs a wake that does NOT depend on the strap. It cannot ride
          # the re-score task, which is submitted only when a re-score is OWED, and a missing strap owes
          # none, so that task would never run in the one case the warning exists for.
          - $(PRODUCT_BUNDLE_IDENTIFIER).stalebattery
        # Permission strings. iOS shows these verbatim, so they use Baseline's vocabulary (HRV, resting
        # heart rate, readiness, sleep, effort) and describe only what the hosted screens do.
        NSBluetoothAlwaysUsageDescription: "Baseline connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your iPhone. Nothing leaves your device."
        NSLocationWhenInUseUsageDescription: "Baseline records your route during an outdoor workout to show distance, pace, and a map, and keeps recording while the screen is off. The route stays on your device. Nothing leaves it."
        NSHealthShareUsageDescription: "Baseline reads your sleep, workouts and heart data from Apple Health on this iPhone to show HRV, resting heart rate, readiness, sleep and effort against your baseline. Nothing leaves your device."
        NSHealthUpdateUsageDescription: "Baseline writes the metrics it computes from your strap back into Apple Health, on-device and only when you allow it."
        NSMotionUsageDescription: "Baseline reads your iPhone's step count for a walking or running workout to show steps in the activity summary. It stays on your device. Nothing leaves it."
        # Speech and AVFAudio are linked through compiled-in NOOP code (CoachVoiceInput), so the
        # purpose strings must exist for the ITMS-90683 scan, but no Baseline screen records audio.
        # The wording stays true if a voice feature is exposed later: transcription is on-device only
        # (requiresOnDeviceRecognition) and never falls back to server transcription.
        NSSpeechRecognitionUsageDescription: "Baseline does not currently record audio. If a voice feature is added, speech is transcribed on this iPhone and never leaves it."
        NSMicrophoneUsageDescription: "Baseline does not currently use the microphone. If a voice feature is added, audio is transcribed on this iPhone and never leaves it."
    entitlements:
      path: Baseline/Resources/Baseline.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Required by HealthKit on iOS 15+ for the observer queries registered by HealthKitBridge.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickschmidt.baseline
        PRODUCT_NAME: "Baseline"
        APP_GROUP_ID: group.com.patrickschmidt.baseline
        DEVELOPMENT_TEAM: 25RC553RGP
        # Baseline's own version line, independent of NOOP's project-level 11.8.0 (429). Target-level
        # settings win, so the first store build is 1.0 (1); Settings → About reads these two keys.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # BaselineIcon is the only app-icon set in the only catalog Baseline compiles
        # (Baseline/Resources/Assets.xcassets); NOOP's catalog is excluded in the StrandiOS source above.
        ASSETCATALOG_COMPILER_APPICON_NAME: BaselineIcon
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only. Baseline's screens are laid out for one column; on iPad it installs and runs in
        # iPhone-compatibility mode rather than claiming a native iPad layout it does not have.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: MarkdownUI
      - package: ZIPFoundation
      # Declared directly (as the macOS Strand target does), not only transitively through WhoopStore:
      # under `xcodebuild test` Xcode builds the package products the app and BaselineTests share as
      # dynamic frameworks, and then OuraLiveSource.o's OuraProtocol symbols no longer arrive folded
      # into WhoopStore's static product, so the app fails to link.
      - package: OuraProtocol
      - package: PolarProtocol
      # Embeds the WidgetKit extension (Baseline.app/PlugIns/BaselineWidgets.appex), as NOOPiOS embeds
      # NOOPiOSWidgets.
      - target: BaselineWidgets

  # Unit tests for Baseline's pure builders (TodaySnapshot, TrendsSeries, SleepNightBuilder, the
  # Journal helpers). Hosted in the app so `@testable import Baseline` links against the real module;
  # no UI, no BLE, no on-disk store (the morning-summary funnel case seeds an in-memory `WhoopStore`
  # through the DEBUG `Repository.setStoreForTesting` seam). Run with `xcodebuild -scheme Baseline test`
  # (simulator destination).
  BaselineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - BaselineTests
    dependencies:
      # XcodeGen derives TEST_HOST ($(BUILT_PRODUCTS_DIR)/Baseline.app/Baseline) and BUNDLE_LOADER from
      # this application dependency; the app's PRODUCT_NAME has no spaces, so the default is exact and
      # nothing is pinned by hand (unlike StrandTests, whose host is "NOOP Staging").
      - target: Baseline
      # The tests build engine inputs (DailyMetric, CachedSleepSession, StageSegment, DoseResponse)
      # and read engine outputs (BaselineState, ReadinessTier) directly.
      - package: WhoopStore
      - package: StrandAnalytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickschmidt.baseline.tests
        DEVELOPMENT_TEAM: 25RC553RGP
        # Matches the host app: an iPhone-only test bundle cannot load into an iPhone-only app on an
        # iPad destination otherwise.
        TARGETED_DEVICE_FAMILY: "1"

  # Screenshot harness for Baseline's screens (BaselineUITests/ScreenshotTests.swift). Launches the app
  # with its DEBUG launch arguments (--demo-seed, --skip-onboarding / --reset-onboarding, --tab,
  # --welcome-step, --ui-testing), scrolls each screen and writes PNGs to $BASELINE_SHOTS_DIR so a scrolled screen can
  # be verified headlessly. Run with `-only-testing:BaselineUITests`; see BASELINE.md.
  BaselineUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - BaselineUITests
    dependencies:
      - target: Baseline
    settings:
      base:
        TEST_TARGET_NAME: Baseline
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickschmidt.baseline.uitests
        DEVELOPMENT_TEAM: 25RC553RGP
        # Matches the host app (iPhone only).
        TARGETED_DEVICE_FAMILY: "1"

  # Baseline's WidgetKit extension (BaselineWidgets/): the Home Screen HRV widget and the Lock Screen
  # readiness accessories. Modelled on NOOPiOSWidgets below, but it links NO NOOP package: the only
  # file it shares with the app is the plain Codable `BaselineWidgetSnapshot` (listed in both targets'
  # sources), which the app writes as JSON into the App Group (BaselineWidgetPublisher) and the
  # extension reads. Embedded by the `- target: BaselineWidgets` dependency on Baseline above.
  BaselineWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BaselineWidgets
        excludes:
          - "Info.plist"
          - "BaselineWidgets.entitlements"
      # The one shared file: Foundation only, no engine import, so the extension stays tiny.
      - path: Baseline/App/BaselineWidgetSnapshot.swift
    info:
      path: BaselineWidgets/Info.plist
      properties:
        CFBundleDisplayName: Baseline
        # Version keys live HERE, not hand-edited into the file, because xcodegen regenerates the plist
        # (the NOOPiOSWidgets rationale, #416): the extension's version must match the parent app's or
        # iOS warns, and both read the Baseline target's own 1.0 (1) line through the settings below.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Mirrors the app target: exposes APP_GROUP_ID to the extension at runtime
        # (BaselineWidgetStore.appGroupID reads the AppGroupIdentifier key from its OWN bundle).
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BaselineWidgets/BaselineWidgets.entitlements
      properties:
        # The same group as the app (both resolve $(APP_GROUP_ID) to group.com.patrickschmidt.baseline).
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickschmidt.baseline.widgets
        PRODUCT_NAME: BaselineWidgets
        # Target-level, like the app: the project-level APP_GROUP_ID is NOOP's staging group.
        APP_GROUP_ID: group.com.patrickschmidt.baseline
        DEVELOPMENT_TEAM: 25RC553RGP
        # Lockstep with the Baseline target's version line (see its settings).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only, matching the host app.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  # WidgetKit + Live Activity extension — the iOS analogue of the macOS menu-bar
  # extra. Reads a tiny snapshot the app publishes into the shared App Group.
  NOOPiOSWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StrandiOSWidgets
        excludes:
          - "Info.plist"
          - "NOOPWidgets.entitlements"
      - path: StrandiOSShared
    info:
      path: StrandiOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: NOOP
        # Version keys MUST live here in the generated-Info.plist properties — NOT hand-edited into the
        # file — because xcodegen regenerates StrandiOSWidgets/Info.plist on every `xcodegen generate`
        # (which every release runs for the version bump) and would otherwise rewrite them to its
        # defaults 1.0 / 1. Inheriting $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) keeps the widget
        # extension lockstep with the parent app, so iOS stops warning "extension version must match
        # parent app" (#416). This is the durable fix; the earlier file edit silently reverted.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Mirrors the app target: exposes APP_GROUP_ID to the extension at runtime (WidgetSnapshot.suiteName).
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StrandiOSWidgets/NOOPWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.widgets
        PRODUCT_NAME: NOOPWidgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: StrandDesign

  # ---------------------------------------------------------------------------
  # watchOS app (M3 — Apple-only). The iPhone is the brain: M1 computes Charge/
  # Effort/Rest with confidence + provenance, and the phone-side WatchSessionBridge
  # pushes a WatchScoreSnapshot to the watch. This app DISPLAYS that snapshot
  # (3 rings + numbers + live HR + sleep line); it does NOT recompute scores.
  # A calibrating score renders as "needs more data" (a dash + cal marker), never
  # a fabricated number. Live HR comes from the watch's OWN HealthKit sensor.
  # Modern single-target watchOS app (WKApplication, watchOS 9+ SwiftUI lifecycle).
  NOOPWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      # Includes NOOPWatch/Localizable.xcstrings, the watch app's OWN string catalog (the watch cannot
      # read the phone app's Strand/Resources catalog; a target only ships the catalogs in its sources).
      # Shared StrandDesign strings localize via the package's own catalog + bundle: .module.
      - path: NOOPWatch
        excludes:
          - "Info.plist"
          - "NOOPWatch.entitlements"
    info:
      path: NOOPWatch/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Surfaces APP_GROUP_ID to runtime (WatchScoreStore.suiteName) so the App Group id isn't
        # hard-coded in Swift; stays in sync with the application-groups entitlement (both $(APP_GROUP_ID)).
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        # Modern single-target watchOS app — no separate WatchKit extension.
        WKApplication: true
        # Pairs this watch app to the iPhone companion (must match NOOPiOS PRODUCT_BUNDLE_IDENTIFIER).
        # Built from the same $(BUNDLE_ID_PREFIX) rather than $(PRODUCT_BUNDLE_IDENTIFIER) because that
        # build setting would resolve to THIS target's own id, not NOOPiOS's.
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).noop
        NSHealthShareUsageDescription: "NOOP reads your heart rate from the Watch sensor to show a live readout on your wrist. It stays on your device."
        NSHealthUpdateUsageDescription: "NOOP records a basic workout session on your Watch for a higher-fidelity heart rate. The session stays on your device."
    entitlements:
      path: NOOPWatch/NOOPWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.watch
        # The bundle FILE is NOOPWatch.app so it doesn't collide with the iPhone app's NOOP.app when it is
        # embedded at NOOP.app/Watch/NOOPWatch.app. The user still sees "NOOP" on the wrist via the
        # CFBundleName / CFBundleDisplayName above.
        PRODUCT_NAME: NOOPWatch
        GENERATE_INFOPLIST_FILE: NO
        # The watch app icon (NOOPWatch/Assets.xcassets/AppIcon.appiconset — the NOOP mark, watchOS single-size).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # watchOS family.
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: StrandDesign
      - package: StrandAnalytics
      # The complication WidgetKit extension is embedded inside the watch app.
      - target: NOOPWatchComplications

  # WidgetKit complication extension for the watch face. Reads the same shared-App-Group
  # snapshot the watch app displays, so the complication + glance can never disagree.
  # Charge ring is the headline; accessoryRectangular shows all three scores. Honours
  # confidence (a calibrating score shows a dash + cal marker, not a fabricated number).
  NOOPWatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      # Includes NOOPWatchComplications/Localizable.xcstrings: the complication is its own bundle and
      # needs its own catalog (it cannot read the watch app's, let alone the phone's).
      - path: NOOPWatchComplications
        excludes:
          - "Info.plist"
          - "NOOPWatchComplications.entitlements"
    info:
      path: NOOPWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: NOOP
        # Version keys live here as generated-plist properties so xcodegen keeps them lockstep with the
        # parent watch app on every regenerate (mirrors the NOOPiOSWidgets rationale, #416).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Mirrors the watch app: exposes APP_GROUP_ID to the extension at runtime (WatchScoreStore.suiteName).
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NOOPWatchComplications/NOOPWatchComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.watch.complications
        PRODUCT_NAME: NOOPWatchComplications
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        # Parity with the other UI targets: auto-extract LocalizedStringKey / String(localized:) usages
        # into this target's Localizable.xcstrings on build.
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: StrandDesign

# Explicit schemes so `xcodebuild -scheme Strand …` builds + tests the macOS app (with StrandTests
# wired in) and `-scheme NOOPiOS …` builds the iOS app. Names match the app-build CI matrix.
schemes:
  Strand:
    build:
      targets:
        Strand: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrandTests
  NOOPiOS:
    build:
      targets:
        NOOPiOS: all
    run:
      config: Debug
  Baseline:
    build:
      targets:
        Baseline: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BaselineTests
        - BaselineUITests
  # `xcodebuild -scheme NOOPWatch …` compile-verifies the watchOS app + its embedded complication
  # extension (M3). Name matches the app-build CI matrix entry the verify script adds.
  NOOPWatch:
    build:
      targets:
        NOOPWatch: all
    run:
      config: Debug
